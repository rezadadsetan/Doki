<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WK-GPU-RUNNING</title>
<!-- GPU stress for Doki (D-002). The window title is the only channel back to PowerShell:
     WK-GPU-RUNNING | WK-GPU-DONE | WK-GPU-ERROR (context lost) | WK-GPU-NOWEBGL -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Segoe UI", Tahoma, sans-serif; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 16px; left: 16px; padding: 10px 14px; border-radius: 10px; background: rgba(37, 42, 60, .78); color: #fff; font-size: 15px; line-height: 1.5; }
  #hud b { color: #06D170; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: #fff; font-size: 28px; padding: 24px; }
  #msg.err { display: flex; background: #E5484D; }
  #msg.done { display: flex; background: #06D170; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>Doki · GPU stress</b><br><span id="fps">…</span><br><span id="left"></span></div>
<div id="msg"></div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var seconds = Math.max(5, parseInt(params.get("sec") || "120", 10));
  var canvas = document.getElementById("c"), msg = document.getElementById("msg");
  var fpsEl = document.getElementById("fps"), leftEl = document.getElementById("left");
  var finished = false;

  function finish(state, text, cls) {
    if (finished) return;
    finished = true;
    document.title = "WK-GPU-" + state;
    msg.textContent = text; msg.className = cls;
  }

  var gl = canvas.getContext("webgl2", { antialias: false, powerPreference: "high-performance", preserveDrawingBuffer: false });
  if (!gl) { finish("NOWEBGL", "WebGL2 is not available on this device", "err"); return; }

  canvas.addEventListener("webglcontextlost", function (e) { e.preventDefault(); finish("ERROR", "GPU ERROR: the graphics driver reset during the test", "err"); }, false);

  var vs = "#version 300 es\nin vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
  // Heavy per-pixel loop with no early exit, so every pixel does the same amount of work.
  var fs = [
    "#version 300 es",
    "precision highp float;",
    "uniform vec2 r; uniform float t; uniform int n;",
    "out vec4 o;",
    "void main(){",
    "  vec2 uv = (gl_FragCoord.xy * 2.0 - r) / r.y;",
    "  vec2 z = uv * 1.3; vec3 col = vec3(0.0);",
    "  vec2 k = vec2(sin(t * 0.31) * 0.7, cos(t * 0.23) * 0.45);",
    "  for (int i = 0; i < n; i++) {",
    "    z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + k;",
    "    float m = dot(z, z);",
    "    z = m > 4.0 ? z / m : z;",
    "    col += vec3(sin(m * 3.0 + t), cos(m * 1.7 - t), sin(m * 0.9 + 2.0)) * 0.0015;",
    "  }",
    "  col = abs(col);",
    "  o = vec4(col.g * 0.3, min(1.0, col.r * 0.9 + 0.15), col.b * 0.6, 1.0);",
    "}"
  ].join("\n");

  function shader(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  var prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) { finish("NOWEBGL", "Shader error: " + e.message, "err"); return; }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var uR = gl.getUniformLocation(prog, "r"), uT = gl.getUniformLocation(prog, "t"), uN = gl.getUniformLocation(prog, "n");

  function resize() {
    var w = Math.floor(window.innerWidth * (window.devicePixelRatio || 1)), h = Math.floor(window.innerHeight * (window.devicePixelRatio || 1));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
  }

  // Adapt the workload so the GPU stays fully busy while the window still updates (target 20-40 fps).
  var iters = 150, frames = 0, lastFps = performance.now(), start = performance.now();
  function frame(now) {
    if (finished) return;
    var elapsed = (now - start) / 1000;
    if (elapsed >= seconds) { finish("DONE", "GPU test finished", "done"); setTimeout(function () { try { window.close(); } catch (e) { } }, 500); return; }
    if (gl.isContextLost()) { finish("ERROR", "GPU ERROR: the graphics driver reset during the test", "err"); return; }
    resize();
    gl.uniform2f(uR, canvas.width, canvas.height); gl.uniform1f(uT, elapsed); gl.uniform1i(uN, iters);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    frames++;
    if (now - lastFps >= 1000) {
      var fps = frames * 1000 / (now - lastFps);
      if (fps > 40) iters = Math.min(20000, Math.round(iters * 1.25));
      else if (fps < 20) iters = Math.max(20, Math.round(iters * 0.8));
      fpsEl.textContent = fps.toFixed(0) + " fps · load " + iters;
      leftEl.textContent = Math.max(0, Math.ceil(seconds - elapsed)) + " s";
      frames = 0; lastFps = now;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
