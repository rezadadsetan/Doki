<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Doki laptop diagnostic console">
  <defs>
    <radialGradient id="flare" cx="79%" cy="42%" r="58%">
      <stop offset="0" stop-color="#ff4d3d" stop-opacity=".34"/>
      <stop offset=".48" stop-color="#ff8a1f" stop-opacity=".11"/>
      <stop offset="1" stop-color="#090708" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff4d3d"/>
      <stop offset=".52" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .display{font:700 52px 'Trebuchet MS',sans-serif;fill:#fff4e6;letter-spacing:-1.5px}
      .label{font:700 10px 'Trebuchet MS',sans-serif;fill:#ff8a1f;letter-spacing:2px}
      .body{font:14px 'Trebuchet MS',sans-serif;fill:#bda7a2}
      .tag{font:700 11px 'Trebuchet MS',sans-serif;fill:#fff4e6}
      .num{font:700 38px 'Trebuchet MS',sans-serif;fill:#fff4e6}
      .tiny{font:10px ui-monospace,Consolas,monospace;fill:#bda7a2;letter-spacing:1px}
      @keyframes pulse{50%{opacity:.42;transform:scale(.96)}}
      @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
      .pulse{transform-origin:732px 157px;animation:pulse 2.8s ease-in-out infinite}
      .intro{animation:rise .8s cubic-bezier(.32,.72,0,1) both}
      @media(prefers-reduced-motion:reduce){.pulse,.intro{animation:none}}
    </style>
  </defs>
  <rect width="900" height="330" rx="26" fill="#171012"/>
  <rect x="7" y="7" width="886" height="316" rx="21" fill="#0f0b0c" stroke="#4b2524"/>
  <rect x="7" y="7" width="886" height="316" rx="21" fill="url(#flare)"/>
  <path d="M29 41h348" stroke="url(#hot)" stroke-width="2"/>
  <circle cx="29" cy="41" r="4" fill="#ff4d3d"/>
  <text x="42" y="69" class="label">DOKI / DEVICE HEALTH CONSOLE</text>
  <g class="intro">
    <text x="42" y="132" class="display">Know the laptop.</text>
    <text x="42" y="172" class="display">Trust the result.</text>
    <text x="42" y="204" class="body">Portable Windows diagnostics for second-hand laptop QC.</text>
    <g transform="translate(42 235)"><rect width="132" height="26" rx="13" fill="#211315" stroke="#66302b"/><text x="66" y="17" text-anchor="middle" class="tag">BATTERY</text></g>
    <g transform="translate(187 235)"><rect width="132" height="26" rx="13" fill="#211315" stroke="#66302b"/><text x="66" y="17" text-anchor="middle" class="tag">STORAGE</text></g>
    <g transform="translate(332 235)"><rect width="132" height="26" rx="13" fill="#211315" stroke="#66302b"/><text x="66" y="17" text-anchor="middle" class="tag">STRESS</text></g>
    <g transform="translate(42 275)"><rect width="132" height="26" rx="13" fill="#211315" stroke="#66302b"/><text x="66" y="17" text-anchor="middle" class="tag">DRIVERS</text></g>
    <g transform="translate(187 275)"><rect width="132" height="26" rx="13" fill="#211315" stroke="#66302b"/><text x="66" y="17" text-anchor="middle" class="tag">UPDATES</text></g>
    <g transform="translate(332 275)"><rect width="132" height="26" rx="13" fill="#211315" stroke="#66302b"/><text x="66" y="17" text-anchor="middle" class="tag">REPORT</text></g>
  </g>
  <g class="pulse">
    <circle cx="732" cy="157" r="111" fill="none" stroke="#5d2925"/>
    <circle cx="732" cy="157" r="83" fill="none" stroke="#351919" stroke-dasharray="3 8"/>
  </g>
  <path d="M630 160h38l13-26 21 51 19-73 23 48h30l12-21 14 21h34" fill="none" stroke="url(#hot)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text x="732" y="218" text-anchor="middle" class="num">1.4.0</text>
  <text x="732" y="239" text-anchor="middle" class="tiny">SYSTEM / PORTABLE</text>
  <circle cx="636" cy="160" r="6" fill="#ff4d3d" filter="url(#glow)"/>
  <circle cx="834" cy="160" r="5" fill="#ffc857"/>
  <text x="858" y="312" text-anchor="end" class="tiny">STATUS / READY FOR INSPECTION</text>
</svg>
